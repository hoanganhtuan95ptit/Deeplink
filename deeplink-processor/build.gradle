plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'maven-publish'
}

// Processor chạy trên JVM của máy build (không phải thiết bị Android),
// nên dùng Java 11 là đủ và tương thích rộng.
java {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

publishing {
    repositories {
        // Publish lên Maven Local (~/.m2) để test nội bộ trước khi release.
        mavenLocal()
    }
    publications {
        // Publish JAR thuần (components.java) vì module này không có Android component.
        // Maven coordinates: com.github.hoanganhtuan95ptit:deeplink-processor:1.0.0
        // (group + version kế thừa từ subprojects {} trong root build.gradle)
        maven(MavenPublication) {
            from components.java
            artifactId = "deeplink-processor"
        }
    }
}

dependencies {
    // KSP API: cung cấp Resolver, CodeGenerator, KSClassDeclaration, … để viết processor
    implementation(libs.symbol.processing.api)

    // KotlinPoet: DSL để sinh file .kt theo chuẩn Kotlin (FileSpec, TypeSpec, FunSpec, …)
    implementation(libs.kotlinpoet)
    // Extension của KotlinPoet tích hợp với KSP (toClassName(), writeTo(codeGenerator), …)
    implementation(libs.kotlinpoet.ksp)

    // api thay vì implementation để consumer (module deeplink) thấy được AutoRegisterProcessor
    api(libs.auto.register.processor)
}